<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard | Enzo Annie Luxury</title>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <script src="config.js"></script>  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 18px;
      background: #101010;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 650px;
      margin: 25px auto;
      padding: 24px;
      background: #1b1b1b;
      border: 1px solid #bd984b;
      border-radius: 14px;
    }

    h1 { color: #e4bd65; }

    p { color: #ccc; line-height: 1.6; }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
    }

    input, select, textarea, button {
      width: 100%;
      padding: 12px;
      border-radius: 7px;
      font-size: 16px;
    }

    input, select, textarea {
      color: #fff;
      background: #292929;
      border: 1px solid #555;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      margin-top: 18px;
      border: 0;
      background: #d7ad52;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .secondary {
      background: #444;
      color: white;
    }

    .delete-button {
      background: #a52a2a;
      color: #fff;
      margin-top: 10px;
    }

    .hidden { display: none !important; }

    #message {
      margin-top: 16px;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    #preview {
      display: none;
      width: 100%;
      max-height: 250px;
      object-fit: contain;
      margin-top: 12px;
      border-radius: 8px;
      background: #fff;
    }

    .product {
      padding: 14px 0;
      border-bottom: 1px solid #444;
      overflow-wrap: anywhere;
    }

    .product img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      background: white;
      border-radius: 6px;
    }

    .small {
      font-size: 13px;
      color: #bbb;
    }
  </style></head><body>
  <main class="container">
    <h1>Enzo Annie Luxury</h1>
    <p>Administrator Dashboard</p><div id="loginSection">
  <h2>Admin Login</h2>

  <form id="loginForm">
    <label for="email">Administrator Email</label>
    <input id="email" type="email" autocomplete="username" required>

    <label for="password">Password</label>
    <input id="password" type="password"
      autocomplete="current-password" required>

    <button id="loginButton" type="submit">Sign In</button>
  </form>
</div>

<div id="dashboard" class="hidden">
  <p id="signedInAs"></p>

  <button id="logoutButton" class="secondary" type="button">
    Sign Out
  </button>

  <hr style="margin-top:25px;border-color:#444">

  <h2>Add New Product</h2>

  <form id="productForm">
    <label for="name">Product Name</label>
    <input id="name" maxlength="150"
      placeholder="e.g. Luxury Crystal Chandelier" required>

    <label for="price">Price (₦)</label>
    <input id="price" type="number" min="0" step="0.01"
      placeholder="e.g. 85000" required>

    <label for="category">Category</label>
    <select id="category" required>
      <option value="">Choose a category</option>
      <option value="Lighting">Lighting</option>
      <option value="Electronics">Electronics</option>
      <option value="Accessories">Accessories</option>
      <option value="Other">Other</option>
    </select>

    <label for="description">Product Description</label>
    <textarea id="description" maxlength="5000"
      placeholder="Describe your product..." required></textarea>

    <label for="imageFile">Product Image</label>
    <input id="imageFile" type="file"
      accept="image/jpeg,image/png,image/webp" required>

    <p class="small">
      Use a JPG, PNG or WebP image. Maximum size: 5 MB.
    </p>

    <img id="preview" alt="Selected product image preview">

    <button id="saveButton" type="submit">
      Upload and Add Product
    </button>
  </form>

  <h2 style="margin-top:35px">Your Products</h2>

  <div id="productsList">Loading products...</div>
</div>

<div id="message" role="status" aria-live="polite"></div>

  </main>  <script>
    (() => {
      const message = document.getElementById("message");
      const loginSection = document.getElementById("loginSection");
      const dashboard = document.getElementById("dashboard");
      const loginForm = document.getElementById("loginForm");
      const productForm = document.getElementById("productForm");
      const loginButton = document.getElementById("loginButton");
      const saveButton = document.getElementById("saveButton");
      const imageFile = document.getElementById("imageFile");
      const preview = document.getElementById("preview");
      const productsList = document.getElementById("productsList");

      const ADMIN_ID = "e3e5a6cc-476a-425b-8c4d-10efccd6e26e";

      function showMessage(text, success = false) {
        message.textContent = text;
        message.style.color = success ? "#9be7a5" : "#ffb4a8";
      }

      if (!window.STORE_CONFIG ||
          !window.STORE_CONFIG.SUPABASE_URL ||
          !window.STORE_CONFIG.SUPABASE_ANON_KEY ||
          !window.supabase) {
        showMessage("Setup error: Check config.js and the Supabase library.");
        loginForm.classList.add("hidden");
        return;
      }

      const client = window.supabase.createClient(
        window.STORE_CONFIG.SUPABASE_URL,
        window.STORE_CONFIG.SUPABASE_ANON_KEY
      );

      async function requireAdmin() {
        const { data, error } = await client.auth.getUser();

        if (error || !data.user) {
          throw new Error("Your session has expired. Please sign in again.");
        }

        if (data.user.id !== ADMIN_ID) {
          throw new Error("This account is not authorized as administrator.");
        }

        return data.user;
      }

      async function showDashboard(user) {
        if (!user || user.id !== ADMIN_ID) {
          await client.auth.signOut();
          loginSection.classList.remove("hidden");
          dashboard.classList.add("hidden");
          showMessage("Access denied. This account is not the designated administrator.");
          return;
        }

        loginSection.classList.add("hidden");
        dashboard.classList.remove("hidden");

        document.getElementById("signedInAs").textContent =
          "Signed in as: " + user.email;

        showMessage("");
        await loadProducts();
      }

      async function checkSession() {
        const { data, error } = await client.auth.getSession();

        if (error) {
          showMessage("Could not check login: " + error.message);
          return;
        }

        if (data.session) {
          await showDashboard(data.session.user);
        }
      }

      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        loginButton.disabled = true;
        showMessage("Signing in...");

        try {
          const { data, error } = await client.auth.signInWithPassword({
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value
          });

          if (error) throw error;

          if (!data.user || data.user.id !== ADMIN_ID) {
            await client.auth.signOut();
            throw new Error("This account is not authorized as administrator.");
          }

          await showDashboard(data.user);
        } catch (error) {
          showMessage("Sign-in failed: " + error.message);
        } finally {
          loginButton.disabled = false;
        }
      });

      document.getElementById("logoutButton").addEventListener(
        "click", async () => {
          const { error } = await client.auth.signOut();

          if (error) {
            showMessage("Sign-out failed: " + error.message);
            return;
          }

          dashboard.classList.add("hidden");
          loginSection.classList.remove("hidden");
          productForm.reset();
          preview.removeAttribute("src");
          preview.style.display = "none";
          productsList.textContent = "";
          showMessage("You have signed out.", true);
        }
      );

      imageFile.addEventListener("change", () => {
        const file = imageFile.files[0];

        if (!file) {
          preview.style.display = "none";
          return;
        }

        if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
          imageFile.value = "";
          preview.style.display = "none";
          showMessage("Choose a JPG, PNG or WebP image.");
          return;
        }

        if (file.size > 5 * 1024 * 1024) {
          imageFile.value = "";
          preview.style.display = "none";
          showMessage("Image is too large. Maximum size is 5 MB.");
          return;
        }

        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
        showMessage("");
      });

      async function loadProducts() {
        productsList.textContent = "Loading products...";

        try {
          await requireAdmin();

          const { data, error } = await client
            .from("products")
            .select("id, name, price, category, image_url")
            .order("created_at", { ascending: false });

          if (error) throw error;

          productsList.replaceChildren();

          if (!data || data.length === 0) {
            productsList.textContent = "No products added yet.";
            return;
          }

          data.forEach((product) => {
            const item = document.createElement("div");
            item.className = "product";

            const img = document.createElement("img");
            img.src = product.image_url || "";
            img.alt = product.name || "Product image";
            img.loading = "lazy";

            const title = document.createElement("h3");
            title.textContent = product.name || "Unnamed product";

            const details = document.createElement("p");
            details.textContent =
              (product.category || "Uncategorized") + " — ₦" +
              Number(product.price).toLocaleString("en-NG");

            const deleteButton = document.createElement("button");
            deleteButton.type = "button";
            deleteButton.className = "delete-button";
            deleteButton.textContent = "Delete Product";

            deleteButton.addEventListener("click", async () => {
              if (deleteButton.disabled) return;

              const confirmed = window.confirm(
                'Are you sure you want to delete "' +
                (product.name || "this product") +
                '"?\n\nThis will remove the product from your database. This action cannot be undone.'
              );

              if (!confirmed) return;

              deleteButton.disabled = true;
              deleteButton.textContent = "Deleting...";
              showMessage("Deleting product...");

              try {
                // Verify the authenticated administrator before deleting.
                await requireAdmin();

                // Delete the product record first.
                const { data: deletedRows, error: deleteError } =
                  await client
                    .from("products")
                    .delete()
                    .eq("id", product.id)
                    .select("id");

                if (deleteError) throw deleteError;

                if (!deletedRows || deletedRows.length === 0) {
                  throw new Error(
                    "No product was deleted. Check the database permissions and try again."
                  );
                }

                // Refresh immediately after the database deletion.
                await loadProducts();

                showMessage(
                  "Product deleted successfully.",
                  true
                );

                // Remove its image from Storage if the URL belongs to
                // this project's product-images bucket.
                if (product.image_url) {
                  try {
                    const imageUrl = new URL(product.image_url);
                    const projectUrl = new URL(
                      window.STORE_CONFIG.SUPABASE_URL
                    );

                    const expectedPrefix =
                      "/storage/v1/object/public/product-images/";

                    if (
                      imageUrl.origin === projectUrl.origin &&
                      imageUrl.pathname.startsWith(expectedPrefix)
                    ) {
                      const encodedPath =
                        imageUrl.pathname.slice(expectedPrefix.length);

                      const storagePath = encodedPath
                        .split("/")
                        .map((part) => decodeURIComponent(part))
                        .join("/");

                      if (storagePath && !storagePath.includes("..")) {
                        const { error: storageError } = await client.storage
                          .from("product-images")
                          .remove([storagePath]);

                        if (storageError) {
                          console.error(
                            "Product deleted, but image cleanup failed:",
                            storageError
                          );

                          showMessage(
                            "Product deleted, but its image could not be removed from Storage. Check the Storage permissions.",
                            false
                          );
                        }
                      }
                    }
                  } catch (storageCleanupError) {
                    console.error(
                      "Product deleted, but image cleanup failed:",
                      storageCleanupError
                    );

                    showMessage(
                      "Product deleted, but image cleanup needs attention.",
                      false
                    );
                  }
                }
              } catch (error) {
                showMessage(
                  "Could not delete product: " + error.message
                );

                deleteButton.disabled = false;
                deleteButton.textContent = "Delete Product";
              }
            });

            item.append(img, title, details, deleteButton);
            productsList.appendChild(item);
          });
        } catch (error) {
          productsList.textContent =
            "Could not load products: " + error.message;
        }
      }

      productForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        saveButton.disabled = true;

        let uploadedPath = null;
        let productInserted = false;

        try {
          showMessage("Checking administrator permissions...");

          const user = await requireAdmin();

          const file = imageFile.files[0];

          if (!file) throw new Error("Please choose a product image.");

          if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
            throw new Error("Choose a JPG, PNG or WebP image.");
          }

          if (file.size > 5 * 1024 * 1024) {
            throw new Error("Image is too large. Maximum size is 5 MB.");
          }

          const safeName = file.name
            .toLowerCase()
            .replace(/[^a-z0-9._-]/g, "-");

          const path = user.id + "/" +
            Date.now() + "-" + safeName;

          showMessage("Uploading product image...");

          const { error: uploadError } = await client.storage
            .from("product-images")
            .upload(path, file, {
              cacheControl: "3600",
              upsert: false,
              contentType: file.type
            });

          if (uploadError) throw uploadError;

          uploadedPath = path;

          const { data: publicData } = client.storage
            .from("product-images")
            .getPublicUrl(path);

          const product = {
            name: document.getElementById("name").value.trim(),
            price: Number(document.getElementById("price").value),
            category: document.getElementById("category").value,
            description: document.getElementById("description").value.trim(),
            image_url: publicData.publicUrl
          };

          if (!product.name || !product.description ||
              !Number.isFinite(product.price) || product.price < 0) {
            throw new Error("Check the product name, description and price.");
          }

          showMessage("Saving product...");

          const { error: insertError } = await client
            .from("products")
            .insert(product);

          if (insertError) throw insertError;

          productInserted = true;

          showMessage(
            "Product added successfully! Check your storefront.",
            true
          );

          productForm.reset();
          preview.removeAttribute("src");
          preview.style.display = "none";

          await loadProducts();
        } catch (error) {
          showMessage("Could not add product: " + error.message);

          // Remove the uploaded image only if the database insert
          // did not succeed.
          if (uploadedPath && !productInserted) {
            const { error: cleanupError } = await client.storage
              .from("product-images")
              .remove([uploadedPath]);

            if (cleanupError) {
              console.error("Unused image cleanup failed:", cleanupError);
            }
          }
        } finally {
          saveButton.disabled = false;
        }
      });

      client.auth.onAuthStateChange((event, session) => {
        if (event === "SIGNED_OUT" || !session) {
          dashboard.classList.add("hidden");
          loginSection.classList.remove("hidden");
        }
      });

      checkSession();
    })();
  </script></body>
</html>
