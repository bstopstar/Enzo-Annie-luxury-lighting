<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechVault | Premium Electronics Store</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 15px 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-brand h1 {
            color: #1e293b;
            font-size: 22px;
            font-weight: 700;
        }

        .nav-brand h1 span {
            color: #0284c7;
        }

        .nav-search {
            display: flex;
            align-items: center;
            background: #f1f5f9;
            padding: 10px 18px;
            border-radius: 30px;
            width: 400px;
            border: 1px solid #e2e8f0;
        }

        .nav-search input {
            border: none;
            background: transparent;
            outline: none;
            margin-left: 10px;
            width: 100%;
            font-size: 14px;
        }

        .whatsapp-btn {
            background: #25d366;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .whatsapp-btn:hover {
            background: #20ba5a;
        }

        /* Layout */
        .main-container {
            display: flex;
            max-width: 1250px;
            margin: 30px auto;
            padding: 0 20px;
            gap: 25px;
        }

        .sidebar {
            width: 260px;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            height: fit-content;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        .sidebar h3 {
            margin-bottom: 15px;
            font-size: 16px;
            color: #1e293b;
        }

        .sidebar ul {
            list-style: none;
        }

        .sidebar li {
            padding: 12px 14px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 6px;
            font-size: 14px;
            color: #475569;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s, color 0.2s;
        }

        .sidebar li i {
            width: 18px;
            color: #64748b;
        }

        .sidebar li:hover, .sidebar li.active {
            background: #e0f2fe;
            color: #0369a1;
            font-weight: 600;
        }

        .sidebar li:hover i, .sidebar li.active i {
            color: #0284c7;
        }

        .feed {
            flex: 1;
        }

        .feed h2 {
            margin-bottom: 20px;
            font-size: 20px;
            color: #1e293b;
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            border: 1px solid #f1f5f9;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.08);
        }

        .product-card img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            background: #f8fafc;
        }

        .product-info {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .product-price {
            font-weight: 700;
            font-size: 18px;
            color: #0ea5e9;
            margin-bottom: 6px;
        }

        .product-title {
            font-size: 15px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 6px;
        }

        .product-desc {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 16px;
            flex: 1;
            line-height: 1.4;
        }

        .order-btn {
            background: #0f172a;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .order-btn:hover {
            background: #1e293b;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 25px;
            color: #94a3b8;
            font-size: 13px;
            margin-top: 50px;
            border-top: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>

    <!-- Header / Brand Name -->
    <header class="navbar">
        <div class="nav-brand">
            <h1><i class="fa-solid fa-bolt"></i> Tech<span>Vault</span></h1>
        </div>
        <div class="nav-search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search phones, laptops, gadgets...">
        </div>
        <div class="nav-contact">
            <!-- CHANGE THE NUMBER 2348000000000 TO YOUR WHATSAPP NUMBER -->
            <a href="https://wa.me/2348000000000" target="_blank" class="whatsapp-btn">
                <i class="fa-brands fa-whatsapp"></i> Chat on WhatsApp
            </a>
        </div>
    </header>

    <!-- Main Content Layout -->
    <div class="main-container">
        <!-- Categories Sidebar -->
        <aside class="sidebar">
            <h3>Categories</h3>
            <ul>
                <li class="category-item active" data-category="all"><i class="fa-solid fa-border-all"></i> All Electronics</li>
                <li class="category-item" data-category="smartphones"><i class="fa-solid fa-mobile-screen"></i> Smartphones</li>
                <li class="category-item" data-category="laptops"><i class="fa-solid fa-laptop"></i> Laptops & PCs</li>
                <li class="category-item" data-category="audio"><i class="fa-solid fa-headphones"></i> Audio & Earbuds</li>
                <li class="category-item" data-category="accessories"><i class="fa-solid fa-plug"></i> Accessories</li>
            </ul>
        </aside>

        <!-- Product Grid -->
        <main class="feed">
            <h2>Hot Deals & New Arrivals</h2>
            <div class="product-grid" id="productGrid">
                <!-- Products load dynamically from JavaScript -->
            </div>
        </main>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 TechVault. Powered by GitHub Pages.</p>
    </footer>

    <script>
        // --- ADD OR UPDATE YOUR ELECTRONICS STOCK HERE ---
        let products = [
            { 
                title: "Infinix Hot 40i (8GB/256GB)", 
                price: "₦145,000", 
                category: "smartphones", 
                image: "https://images.unsplash.com/photo-1598327105666-5b89351aff97?w=500", 
                desc: "Smooth performance, 90Hz punch-hole display, and massive storage capacity." 
            },
            { 
                title: "Wireless Noise-Canceling Earbuds", 
                price: "₦28,000", 
                category: "audio", 
                image: "https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=500", 
                desc: "Deep bass, crystal-clear microphone, and 30-hour total battery life with charging case." 
            },
            { 
                title: "HP Pavilion 15 Core i5 Laptop", 
                price: "₦420,000", 
                category: "laptops", 
                image: "https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=500", 
                desc: "Fast processing speed, 16GB RAM, 512GB SSD, ideal for work and multitasking." 
            },
            { 
                title: "Fast Charging Power Bank 20,000mAh", 
                price: "₦22,000", 
                category: "accessories", 
                image: "https://images.unsplash.com/photo-1609592424104-93ad120cfd2b?w=500", 
                desc: "Dual USB outputs with 22.5W fast charge technology for all mobile devices." 
            },
            { 
                title: "Samsung Galaxy S23 Ultra", 
                price: "₦780,000", 
                category: "smartphones", 
                image: "https://images.unsplash.com/photo-1610945265064-0e34e5519bbf?w=500", 
                desc: "Flagship camera quality, stunning AMOLED display, and S-Pen included." 
            },
            { 
                title: "Bluetooth RGB Gaming Speaker", 
                price: "₦18,500", 
                category: "audio", 
                image: "https://images.unsplash.com/photo-1545454675-3531b543be5d?w=500", 
                desc: "Dynamic LED light effects with punchy stereo sound and deep bass resonance." 
            }
        ];

        const productGrid = document.getElementById("productGrid");
        const searchInput = document.getElementById("searchInput");
        const categoryItems = document.querySelectorAll(".sidebar li");

        let currentCategory = "all";

        function displayProducts(items) {
            productGrid.innerHTML = "";
            if (items.length === 0) {
                productGrid.innerHTML = "<p>No electronics found matching your search.</p>";
                return;
            }
            
            items.forEach(product => {
                // CHANGE THE NUMBER 2348000000000 BELOW TO YOUR WHATSAPP NUMBER TOO
                const whatsappMessage = encodeURIComponent(`Hello, I would like to buy or inquire about this product: *${product.title}* priced at *${product.price}*. Is it currently available?`);
                const whatsappLink = `https://wa.me/2348000000000?text=${whatsappMessage}`;

                const card = document.createElement("div");
                card.classList.add("product-card");
                card.innerHTML = `
                    <img src="${product.image}" alt="${product.title}">
                    <div class="product-info">
                        <div class="product-price">${product.price}</div>
                        <div class="product-title">${product.title}</div>
                        <div class="product-desc">${product.desc}</div>
                        <a href="${whatsappLink}" target="_blank" class="order-btn">
                            <i class="fa-brands fa-whatsapp"></i> Inquire / Order
                        </a>
                    </div>
                `;
                productGrid.appendChild(card);
            });
        }

        function filterProducts() {
            const searchText = searchInput.value.toLowerCase();
            const filtered = products.filter(p => {
                const matchesCategory = currentCategory === "all" || p.category === currentCategory;
                const matchesSearch = p.title.toLowerCase().includes(searchText) || p.desc.toLowerCase().includes(searchText);
                return matchesCategory && matchesSearch;
            });
            displayProducts(filtered);
        }

        searchInput.addEventListener("input", filterProducts);

            categoryItems.forEach(item => {
            item.addEventListener("click", () => {
                categoryItems.forEach(i => i.classList.remove("active"));
                item.classList.add("active");
                currentCategory = item.getAttribute("data-category");
                filterProducts();
            });
        });

        displayProducts(products);
    </script>
</body>
</html>
